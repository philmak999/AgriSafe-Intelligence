services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrisafe
      POSTGRES_PASSWORD: agrisafe
      POSTGRES_DB: agrisafe
    ports:
      - '5432:5432'
    volumes:
      - agrisafe-postgres-data:/var/lib/postgresql/data

volumes:
  agrisafe-postgres-data:
