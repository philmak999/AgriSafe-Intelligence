<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgriSafe Intelligence</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct load or refresh on
      a route like /risk-timeline 404s (no real file exists at that path).
      GitHub Pages serves this file for any unmatched path — it re-encodes the
      intended route into a query string and redirects to index.html, which
      decodes it back (see the inline script in index.html) before React
      Router mounts. Standard technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep "/AgriSafe-Intelligence"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
