name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # push-to-main is covered by deploy-pages.yml's own build+test gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrisafe
          POSTGRES_PASSWORD: agrisafe
          POSTGRES_DB: agrisafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrisafe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://agrisafe:agrisafe@localhost:5432/agrisafe
      DATABASE_SSL: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run test:run
      - run: npm run build
